# Prometheus Scrape Configuration for CareGraph AI
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'caregraph-api'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'caregraph-api:8000'
          - 'host.docker.internal:8000'
        labels:
          environment: 'production'
          service: 'caregraph-agent-engine'
