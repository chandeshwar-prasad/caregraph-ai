# Render Blueprint Specification (render.yaml)
# CareGraph AI - Multi-Agent Healthcare Care-Coordination Platform
# Infrastructure-as-Code: Backend (FastAPI), Frontend (Next.js), Managed DB (PostgreSQL)

version: "1"

databases:
  - name: caregraph-db
    databaseName: caregraph
    user: caregraph
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ----------------------------------------------------
  # 1. CareGraph FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: caregraph-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caregraph-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
      - key: TELEMETRY_ENABLED
        value: "true"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_PROJECT
        value: caregraph-ai
      - key: ALLOWED_ORIGINS
        value: "https://caregraph-ui.onrender.com,http://localhost:3000,http://localhost:8501"

  # ----------------------------------------------------
  # 2. CareGraph Next.js Frontend Web Service
  # ----------------------------------------------------
  - type: web
    name: caregraph-ui
    runtime: node
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://caregraph-api.onrender.com
